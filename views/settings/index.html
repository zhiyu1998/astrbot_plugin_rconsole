<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R插件 · 设置</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 顶部一体化导航栏 -->
      <header class="topbar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <span>R</span>
          </div>
          <div class="brand-meta">
            <div class="brand-title-row">
              <h1>R插件</h1>
              <span class="ver" id="versionTag"></span>
            </div>
            <p class="brand-sub">多平台音视频解析与媒体管理</p>
          </div>
        </div>

        <nav class="segmented-tabs" role="tablist" aria-label="主视图切换">
          <button class="tab active" data-tab="settings" role="tab" aria-selected="true">
            <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span>配置项</span>
          </button>
          <button class="tab" data-tab="status" role="tab" aria-selected="false">
            <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
            <span>运行状态</span>
          </button>
        </nav>

        <div class="topbar-right">
          <div class="chips" id="heroChips"></div>
          <button id="themeToggle" class="icon-btn" type="button" title="切换深色/浅色主题" aria-label="切换深色或浅色主题">
            <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="main">
        <!-- 配置项面板 -->
        <section id="tab-settings" class="panel" role="tabpanel">
          <div class="layout">
            <aside class="rail">
              <div class="rail-search">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="m21 21-4.3-4.3"/>
                </svg>
                <input id="search" type="search" placeholder="搜索配置项…" autocomplete="off" />
                <kbd class="kbd-hint" id="searchKbd">/</kbd>
              </div>
              <nav class="rail-nav" id="rail" aria-label="配置分组"></nav>
              <div class="rail-foot" id="railFoot"></div>
            </aside>

            <section class="content" id="contentScroll">
              <div class="content-inner">
                <header class="content-head">
                  <div class="content-title-wrap">
                    <span class="content-ico" id="groupIcon" aria-hidden="true"></span>
                    <div>
                      <h2 id="groupTitle">全局</h2>
                      <p class="content-desc" id="groupDesc"></p>
                    </div>
                  </div>
                  <span class="count-pill" id="fieldCount"></span>
                </header>

                <div id="fields" class="fields">
                  <div class="skeleton">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>正在加载配置…</span>
                  </div>
                </div>
              </div>
            </section>
          </div>

          <!-- 浮动保存胶囊栏 -->
          <div class="savebar-dock" id="savebarDock">
            <div class="savebar">
              <div class="savebar-status">
                <span class="pulse-dot" aria-hidden="true"></span>
                <span id="saveHint" class="hint"></span>
              </div>
              <div class="savebar-actions">
                <button id="resetBtn" class="btn ghost" type="button">放弃修改</button>
                <button id="saveBtn" class="btn primary" type="button">
                  <span>保存并生效</span>
                  <kbd class="btn-kbd">Ctrl S</kbd>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 运行状态面板 -->
        <section id="tab-status" class="panel hidden" role="tabpanel">
          <div class="status-shell">
            <header class="status-head">
              <div>
                <h2>运行状态与自检</h2>
                <p class="content-desc">实时查看依赖组件、代理连通性、暂存空间与各平台凭据状态</p>
              </div>
              <div class="actions">
                <button class="btn" type="button" data-probe="proxy">
                  <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                  <span>测试代理 → YouTube</span>
                </button>
                <button class="btn" type="button" data-probe="temp">
                  <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
                  </svg>
                  <span>测试暂存目录</span>
                </button>
                <button class="btn ghost" type="button" id="refreshStatus">
                  <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
                    <path d="M21 3v5h-5"/>
                  </svg>
                  <span>刷新状态</span>
                </button>
              </div>
            </header>

            <div id="statusGrid" class="status-body">
              <div class="skeleton">
                <span class="spinner" aria-hidden="true"></span>
                <span>正在读取状态…</span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
